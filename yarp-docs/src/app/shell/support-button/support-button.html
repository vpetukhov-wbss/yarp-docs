<div class="support-wrap">
  <button
    type="button"
    class="icon-btn support-btn"
    (click)="toggleOpen()"
    aria-haspopup="true"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="'support.cta' | translate"
    [attr.title]="'support.cta' | translate"
  >
    <span class="support-emoji" aria-hidden="true">🍺</span>
  </button>

  @if (open()) {
    <div class="support-menu">
      <div class="cap">{{ 'support.menuTitle' | translate }}</div>
      <a class="support-item" [href]="beerUrl" target="_blank" rel="noopener" (click)="close()">
        {{ 'support.beerLabel' | translate }}
        <span class="price">{{ 'support.beerPrice' | translate }}</span>
      </a>
      <a class="support-item" [href]="knuckleUrl" target="_blank" rel="noopener" (click)="close()">
        {{ 'support.knuckleLabel' | translate }}
        <span class="price">{{ 'support.knucklePrice' | translate }}</span>
      </a>
      <div class="note">{{ 'support.note' | translate }}</div>
    </div>
  }
</div>

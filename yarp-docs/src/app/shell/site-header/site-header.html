<header class="site">
  <button
    type="button"
    class="menu-btn"
    (click)="mobileNav.toggle()"
    [attr.aria-label]="'header.toggleNav' | translate"
    [attr.aria-expanded]="mobileNav.open()"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h16" />
    </svg>
  </button>

  <a routerLink="./" class="brand">
    <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="6" cy="16" r="3.2" fill="currentColor" />
      <circle cx="26" cy="6" r="2.6" fill="currentColor" opacity=".5" />
      <circle cx="26" cy="16" r="2.6" fill="currentColor" opacity=".8" />
      <circle cx="26" cy="26" r="2.6" fill="currentColor" opacity=".5" />
      <path d="M9 16 L23 6 M9 16 L23 16 M9 16 L23 26" stroke="currentColor" stroke-width="1.6" />
    </svg>
    <span class="name">YARP Docs</span>
    <span class="ver">v2.3</span>
  </a>

  <button
    type="button"
    class="hdr-search"
    (click)="openSearch()"
    [attr.aria-label]="'search.shortcutHint' | translate: { key: shortcutKey }"
  >
    <svg
      width="15"
      height="15"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <circle cx="11" cy="11" r="7" />
      <path d="m21 21-4.3-4.3" />
    </svg>
    <span>{{ 'header.searchPlaceholder' | translate }}</span>
    <span class="kbd" aria-hidden="true">
      @if (isApple) {
        <kbd>⌘</kbd>
      } @else {
        <kbd>Ctrl</kbd>
      }
      <kbd>K</kbd>
    </span>
  </button>

  <div class="hdr-actions">
    <button
      type="button"
      class="icon-btn search-btn-mobile"
      (click)="openSearch()"
      [attr.aria-label]="'header.searchAriaLabel' | translate"
    >
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m21 21-4.3-4.3" />
      </svg>
    </button>
    <app-language-picker />
    <app-theme-toggle />
  </div>
</header>

<div class="fab-rail">
  <app-support-button />
  <a
    class="fab-btn"
    href="https://www.linkedin.com/in/vladimir-petukhov-5b32ba210"
    target="_blank"
    rel="noopener"
    [attr.aria-label]="'header.creatorLinkedIn' | translate"
    [attr.title]="'header.creatorLinkedIn' | translate"
  >
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor" opacity=".12" />
      <rect x="2" y="2" width="20" height="20" rx="4" stroke="currentColor" stroke-width="1.6" />
      <circle cx="7.5" cy="7.5" r="1.6" fill="currentColor" />
      <rect x="6.2" y="10.5" width="2.6" height="8" rx="0.5" fill="currentColor" />
      <path
        d="M11.5 10.5h2.5v1.4c.55-.95 1.7-1.6 3-1.6 2.6 0 3.4 1.7 3.4 4v4.2h-2.6v-3.7c0-1.1-.4-1.9-1.5-1.9-1.1 0-1.7.75-1.7 1.9v3.7h-2.6v-8z"
        fill="currentColor"
      />
    </svg>
  </a>
</div>

<div class="lang-wrap">
  <button
    type="button"
    class="lang-btn"
    (click)="toggleOpen()"
    aria-haspopup="true"
    [attr.aria-expanded]="open()"
  >
    <svg
      width="15"
      height="15"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="9" />
      <path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" />
    </svg>
    {{ currentLabel() }}
    <svg
      width="11"
      height="11"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      aria-hidden="true"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>

  @if (open()) {
    <div class="lang-menu">
      <div class="cap">Choose a language</div>
      @for (locale of locales; track locale.code) {
        <!-- Selecting only closes the menu for now - real switching (route
             navigation + persistence + <html lang>) lands with LocaleStore
             in Step 12, not before, so it's correct everywhere at once. -->
        <button
          type="button"
          class="lang-item"
          [class.active]="locale.code === currentLocale()"
          (click)="close()"
        >
          {{ locale.nativeLabel }}
          <span class="code">{{ locale.code }}</span>
        </button>
      }
    </div>
  }
</div>

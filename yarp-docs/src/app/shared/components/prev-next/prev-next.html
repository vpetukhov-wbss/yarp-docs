@if (prev() || next()) {
  <div class="page-nav">
    @if (prev(); as prevLink) {
      <a [routerLink]="['../', prevLink.slug]" class="prev">
        <div class="dir">{{ 'article.previous' | translate }}</div>
        <div class="title">{{ prevLink.title }}</div>
      </a>
    } @else {
      <span></span>
    }
    @if (next(); as nextLink) {
      <a [routerLink]="['../', nextLink.slug]" class="next">
        <div class="dir">{{ 'article.next' | translate }}</div>
        <div class="title">{{ nextLink.title }}</div>
      </a>
    }
  </div>
}
